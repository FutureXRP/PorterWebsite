<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Porter Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%230F3B75'/%3E%3Crect x='6' y='16' width='28' height='8' rx='2' fill='%23F26A21'/%3E%3Crect x='12' y='11' width='6' height='18' rx='1.5' fill='%23fff'/%3E%3Crect x='22' y='11' width='6' height='18' rx='1.5' fill='%23fff'/%3E%3Crect x='17' y='6' width='6' height='28' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --blue:#0F3B75; --blue-dark:#0A2A54; --blue-mid:#1B57A6; --blue-tint:#E7EFF9;
  --orange:#F26A21; --orange-dark:#D9581A; --orange-tint:#FDEDE3;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F7F9FC; --line:#DDE3EA; --line-2:#EDF0F4;
  --text:#1F2933; --muted:#5A6B7C; --faint:#8A97A6; --head:#0A2A54;
  --sb-bg:#0A2A54; --sb-text:#B8C7D9; --sb-active:#123A70;
  --s1:#1B57A6; --s2:#F26A21; --s3:#1baf7a; --s4:#eda100;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-bg:#E6F6E6; --warn-bg:#FFF4DA; --crit-bg:#FBE5E5; --info-bg:#E7EFF9;
  --grid:#E6E9EE; --axis:#C9D1DB;
  --shadow:0 8px 24px -10px rgba(10,42,84,.22);
  --radius:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1720; --surface:#161F2B; --surface-2:#1B2533; --line:#2A3542; --line-2:#222C39;
    --text:#E3E9F0; --muted:#9AA9BA; --faint:#6F7E8F; --head:#F4F7FA;
    --blue-tint:#1A2A40; --orange-tint:#3A2417;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --good-text:#3fbf3f;
    --good-bg:#12301A; --warn-bg:#3A2E10; --crit-bg:#3A1717; --info-bg:#1A2A40;
    --grid:#232D3A; --axis:#2F3A48;
    --shadow:0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1720; --surface:#161F2B; --surface-2:#1B2533; --line:#2A3542; --line-2:#222C39;
  --text:#E3E9F0; --muted:#9AA9BA; --faint:#6F7E8F; --head:#F4F7FA;
  --blue-tint:#1A2A40; --orange-tint:#3A2417;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good-text:#3fbf3f;
  --good-bg:#12301A; --warn-bg:#3A2E10; --crit-bg:#3A1717; --info-bg:#1A2A40;
  --grid:#232D3A; --axis:#2F3A48;
  --shadow:0 8px 24px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.92rem;color:var(--text);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Montserrat","Open Sans",sans-serif;color:var(--head);line-height:1.2}
h1{font-size:1.35rem;font-weight:800}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
a{color:inherit}
button{font:inherit;cursor:pointer}
svg{display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* app shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%;background:linear-gradient(90deg,var(--sb-bg) 240px,transparent 240px)}
.sidebar{background:var(--sb-bg);color:var(--sb-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:.7rem;padding:1.1rem 1.1rem .9rem;color:#fff;text-decoration:none}
.sb-brand svg{width:36px;height:36px;flex:none}
.sb-brand b{font-family:"Montserrat",sans-serif;font-weight:800;font-size:.98rem;display:block;line-height:1.1}
.sb-brand small{font-size:.7rem;color:var(--sb-text);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.sb-sec{font-family:"Montserrat",sans-serif;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#6F86A3;padding:1rem 1.2rem .35rem;font-weight:700}
.sb-nav{display:grid;gap:2px;padding:0 .6rem}
.sb-nav button{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:none;border:0;color:var(--sb-text);padding:.6rem .7rem;border-radius:var(--radius);font-weight:600;font-size:.9rem;border-left:3px solid transparent}
.sb-nav button svg{width:18px;height:18px;flex:none;opacity:.85}
.sb-nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-nav button.active{background:var(--sb-active);color:#fff;border-left-color:var(--orange)}
.sb-nav .cnt{margin-left:auto;background:var(--orange);color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;padding:.05rem .45rem;font-family:"Montserrat",sans-serif}
.sb-foot{margin-top:auto;padding:1rem 1.2rem;font-size:.78rem;border-top:1px solid rgba(255,255,255,.08)}
.sb-foot a{color:#fff;text-decoration:none;font-weight:600}
.sb-foot .demo{display:inline-block;background:rgba(242,106,33,.18);color:#FFB380;border:1px solid rgba(242,106,33,.4);border-radius:4px;padding:.1rem .45rem;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.5rem}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;padding:.7rem 1.5rem}
.topbar h1{flex:none}
.topbar .sub{color:var(--muted);font-size:.85rem}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:.5rem;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:.45rem .7rem;color:var(--muted)}
.search svg{width:16px;height:16px;flex:none}
.search input{border:0;background:none;outline:0;width:100%;color:var(--text);font:inherit}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:.6rem}
.iconbtn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);width:38px;height:38px;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:"Montserrat",sans-serif;font-weight:700;font-size:.85rem}
.menu-btn{display:none}
.content{padding:1.5rem;display:grid;gap:1.25rem;align-content:start}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:var(--radius);border:1px solid transparent;padding:.55rem .95rem;font-family:"Montserrat",sans-serif;font-weight:700;font-size:.82rem;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn svg{width:15px;height:15px}
.btn-cta{background:var(--orange);color:#fff}.btn-cta:hover{background:var(--orange-dark)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-mid)}
.btn-ghost{background:var(--surface);color:var(--head);border-color:var(--line)}.btn-ghost:hover{border-color:var(--muted)}
.btn-sm{padding:.35rem .65rem;font-size:.76rem}
.btn-link{background:none;border:0;color:var(--blue-mid);font-weight:700;font-family:"Montserrat",sans-serif;font-size:.8rem;padding:0}
.btn-link:hover{text-decoration:underline}

/* cards / grid */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.9rem}
.card-h .sub{color:var(--muted);font-size:.82rem;margin-top:.1rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:1.25rem}
.g12{display:grid;grid-template-columns:1fr 2fr;gap:1.25rem}
.g21,.g12{align-items:start}
.scroll-list{max-height:440px;overflow-y:auto;padding-right:.2rem}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:700px){.g4,.g3,.g2{grid-template-columns:1fr}}

/* stat tiles */
.stat .label{font-size:.8rem;color:var(--muted);font-weight:600}
.stat .value{font-family:"Montserrat",sans-serif;font-weight:800;font-size:1.7rem;color:var(--head);line-height:1.15;margin:.2rem 0 .3rem}
.stat .delta{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.stat .delta.up{color:var(--good-text)}.stat .delta.down{color:var(--crit)}
.stat .spark{margin-top:.6rem}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -1.2rem;padding:0 1.2rem}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-family:"Montserrat",sans-serif;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:.55rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.65rem .6rem;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td .sub{display:block;color:var(--muted);font-size:.78rem}
td.r,th.r{text-align:right}
.name{font-weight:700;color:var(--head)}

/* pills, chips */
.pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.15rem .6rem;font-size:.74rem;font-weight:700;font-family:"Montserrat",sans-serif;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-bg);color:var(--good-text)}
.p-warn{background:var(--warn-bg);color:#8A5A00}
.p-crit{background:var(--crit-bg);color:var(--crit)}
.p-info{background:var(--info-bg);color:var(--blue-mid)}
.p-neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
:root[data-theme="dark"] .p-warn{color:#F5C55A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-warn{color:#F5C55A}}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;font-size:.78rem;font-weight:600;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.toolbar .search{max-width:300px}
.toolbar .spacer{flex:1}
.tech-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.4rem;vertical-align:middle}

/* lists */
.list{display:grid;gap:.5rem}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.65rem .75rem;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--surface-2)}
.item .t{font-size:.78rem;color:var(--muted);font-family:"Montserrat",sans-serif;font-weight:700;min-width:64px}
.item b{color:var(--head);display:block;font-size:.88rem}
.item span{color:var(--muted);font-size:.8rem}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:center;padding:.6rem .75rem;border-radius:var(--radius);font-size:.85rem}
.alert svg{width:18px;height:18px;flex:none}
.alert.crit{background:var(--crit-bg);color:var(--crit)}
.alert.warn{background:var(--warn-bg);color:#8A5A00}
.alert.info{background:var(--info-bg);color:var(--blue-mid)}
:root[data-theme="dark"] .alert.warn{color:#F5C55A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alert.warn{color:#F5C55A}}
.alert b{color:inherit}
.alert .btn-link{color:inherit}

/* schedule */
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:.6rem;min-width:900px}
.week-wrap{overflow-x:auto}
.day{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--radius);min-height:360px;padding:.5rem}
.day h4{font-family:"Montserrat",sans-serif;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;padding:.2rem .3rem .5rem}
.day h4 b{color:var(--head);font-size:.95rem}
.day.today{border-color:var(--orange);background:var(--surface)}
.day.today h4 b{color:var(--orange)}
.job{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--s1);border-radius:4px;padding:.5rem .6rem;margin-bottom:.45rem;cursor:pointer;font-size:.8rem}
.job:hover{box-shadow:var(--shadow)}
.job .jt{font-family:"Montserrat",sans-serif;font-weight:700;font-size:.72rem;color:var(--muted)}
.job b{display:block;color:var(--head);font-size:.84rem}
.job span{color:var(--muted);display:block}
.legend{display:flex;flex-wrap:wrap;gap:1rem;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.35rem;vertical-align:middle}

/* charts */
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--head);color:#fff;font-size:.76rem;padding:.35rem .55rem;border-radius:4px;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));opacity:0;transition:opacity .1s;z-index:5}
:root[data-theme="dark"] .tip{background:#fff;color:#0A2A54}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tip{background:#fff;color:#0A2A54}}
.tip.show{opacity:1}
.hbar-row{display:grid;grid-template-columns:150px 1fr 80px;gap:.7rem;align-items:center;font-size:.84rem;padding:.3rem 0}
.hbar-row .track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hbar-row .fill{height:100%;background:var(--s1);border-radius:0 3px 3px 0}
.hbar-row .v{text-align:right;color:var(--muted)}
.meter{height:10px;background:var(--blue-tint);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--s1)}
.meter.warn{background:var(--warn-bg)}.meter.warn i{background:var(--warn)}
.meter.crit{background:var(--crit-bg)}.meter.crit i{background:var(--crit)}

/* staff cards */
.staff{display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:start}
.staff .avatar{width:48px;height:48px;font-size:1rem}
.staff .role{color:var(--muted);font-size:.8rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;font-size:.84rem;margin-top:.7rem}
.kv dt{color:var(--muted)}
.kv dd{color:var(--text);font-weight:600}

/* drawer / modal */
.overlay{position:fixed;inset:0;background:rgba(10,42,84,.45);z-index:40;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;box-shadow:-10px 0 40px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:1.4rem 1.5rem calc(1.4rem + env(safe-area-inset-bottom,0px))}
.drawer.show{transform:none}
.drawer h2{margin-bottom:.2rem}
.drawer .close{position:absolute;top:1rem;right:1rem}
.drawer section{margin-top:1.3rem;padding-top:1rem;border-top:1px solid var(--line)}
.drawer section h3{margin-bottom:.5rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:42;display:none;place-items:center;padding:1rem}
.modal.show{display:grid}
.modal .box{background:var(--surface);border-radius:var(--radius);width:min(560px,100%);padding:1.5rem;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto}
.modal h2{margin-bottom:1rem}
form.f{display:grid;gap:.8rem}
.f label{display:grid;gap:.3rem;font-size:.8rem;font-weight:600;color:var(--head)}
.f input,.f select,.f textarea{font:inherit;padding:.55rem .7rem;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--text);width:100%}
.f textarea{min-height:80px;resize:vertical}
.f .row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.f .actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.4rem}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid rgba(242,106,33,.45);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--head);color:#fff;padding:.7rem 1.1rem;border-radius:var(--radius);font-weight:600;font-size:.86rem;opacity:0;transition:.2s;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 2rem)}
:root[data-theme="dark"] .toast{background:#fff;color:#0A2A54}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#fff;color:#0A2A54}}
.toast.show{opacity:1;transform:translateX(-50%)}

/* login */
.login{position:fixed;inset:0;z-index:60;background:var(--blue-dark);display:grid;place-items:center;padding:1rem}
.login .box{background:var(--surface);border-radius:var(--radius);padding:2rem;width:min(400px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);border-top:6px solid var(--orange)}
.login .brand{display:flex;align-items:center;gap:.7rem;margin-bottom:1.2rem}
.login .brand svg{width:40px;height:40px}
.login .brand b{font-family:"Montserrat",sans-serif;font-weight:800;color:var(--head);display:block}
.login .brand small{color:var(--muted);font-size:.75rem}
.login p{color:var(--muted);font-size:.85rem;margin-bottom:1rem}

/* integrations */
.integ{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;padding:.9rem;border:1px solid var(--line);border-radius:var(--radius)}
.integ .logo{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-family:"Montserrat",sans-serif;font-weight:800;color:#fff;font-size:.9rem}
.integ b{display:block;color:var(--head)}
.integ span{color:var(--muted);font-size:.8rem}

@media (max-width:900px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:45;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .menu-btn{display:grid}
  .topbar{padding:.6rem 1rem;flex-wrap:wrap}
  .topbar .search{order:5;flex-basis:100%;max-width:none}
  .content{padding:1rem}
  .tbl-wrap{margin:0 -1.2rem;padding:0 1.2rem}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-grid" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
<symbol id="ic-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 10h18M8 3v4M16 3v4"/></symbol>

/* charts */
function columnChart(el, data, {key='v', label='wk', money=true, highlightLast=true, h=220}={}){
  const w = 720, padL = 48, padR = 8, padT = 12, padB = 28;
  const max = Math.max(...data.map(x=>x[key]));
  const step = niceStep(max);
  const top = Math.ceil(max/step)*step;
  const iw = w-padL-padR, ih = h-padT-padB;
  const bw = Math.min(24, iw/data.length*0.6);
  const y = v => padT + ih - (v/top)*ih;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Column chart">`;
  for(let v=0; v<=top; v+=step){
    s += `<line x1="${padL}" x2="${w-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${padL-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)" font-family="Open Sans,sans-serif">${money?compact$(v):v}</text>`;
  }
  data.forEach((pt,i)=>{
    const cx = padL + (i+0.5)*(iw/data.length);
    const x = cx - bw/2, yy = y(pt[key]), hh = padT+ih-yy;
    const last = highlightLast && i===data.length-1;
    s += `<path d="M${x} ${padT+ih} v${-(hh-4)} a4 4 0 0 1 4 -4 h${bw-8} a4 4 0 0 1 4 4 v${hh-4} z" fill="${last?'var(--s2)':'var(--s1)'}" data-i="${i}" class="bar"/>`;
    s += `<rect x="${cx-iw/data.length/2}" y="${padT}" width="${iw/data.length}" height="${ih}" fill="transparent" data-i="${i}" class="hit"/>`;
    if(i%Math.ceil(data.length/12)===0) s += `<text x="${cx}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--faint)" font-family="Open Sans,sans-serif">${pt[label]}</text>`;
  });
  s += `<line x1="${padL}" x2="${w-padR}" y1="${padT+ih}" y2="${padT+ih}" stroke="var(--axis)"/></svg><div class="tip"></div>`;
  el.innerHTML = s;
  const tip = el.querySelector('.tip'), svg = el.querySelector('svg');
  el.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('mousemove', e=>{
      const i=+r.dataset.i, pt=data[i]; const rect=el.getBoundingClientRect();
      tip.textContent = `${pt[label]}: ${money?fmt$(pt[key]):pt[key]}`;
      tip.style.left = (e.clientX-rect.left)+'px'; tip.style.top = (e.clientY-rect.top)+'px'; tip.classList.add('show');
    });
    r.addEventListener('mouseleave', ()=>tip.classList.remove('show'));
  });
}
function niceStep(max){ const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function compact$(v){ return v>=1000000?'$'+(v/1e6).toFixed(1)+'M':v>=1000?'$'+Math.round(v/1000)+'K':'$'+v; }
function sparkline(vals, w=120, h=32){
  const max=Math.max(...vals), min=Math.min(...vals);
  const pts = vals.map((v,i)=>[i*(w/(vals.length-1)), h-2-((v-min)/((max-min)||1))*(h-4)]);
  const dstr = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${dstr}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
function hbars(rows, {money=true}={}){
  const max = Math.max(...rows.map(r=>r.v));
  return rows.map(r=>`<div class="hbar-row"><span>${esc(r.k)}</span><div class="track"><div class="fill" style="width:${(r.v/max*100).toFixed(1)}%"></div></div><span class="v num">${money?fmt$(r.v):r.v}</span></div>`).join('');
}
function agingChart(){
  const buckets = ['Current','1–30','31–60','61–90','90+'];
  const totals = Object.fromEntries(buckets.map(b=>[b,0]));
  invoices.filter(i=>invStatus(i)!=='Paid').forEach(i=>totals[agingBucket(i)] += i.amount-i.paid);
  const max = Math.max(...Object.values(totals),1);
  return `<div class="list" style="gap:.35rem">${buckets.map((b,i)=>`<div class="hbar-row"><span>${b}${i?' days':''}</span><div class="track"><div class="fill" style="width:${(totals[b]/max*100).toFixed(1)}%;background:${i===0?'var(--s1)':i<3?'var(--warn)':'var(--crit)'}"></div></div><span class="v num">${fmt$(totals[b])}</span></div>`).join('')}</div>`;
}

function jobsTable(list){

function renderJobsTable(){ const list = jobs.filter(j=>(jobFilter==='all'||j.status===jobFilter) && (!jobQ || (cust(j.cust).name+' '+j.service+' '+j.id).toLowerCase().includes(jobQ))).sort((a,b)=>b.date-a.date); document.getElementById('jobs-table').innerHTML = jobsTable(list); }

let custQ = '';

let estFilter = 'all';
views.estimates = () => {

let invFilter = 'all';

  const openInv = invoices.filter(i=>invStatus(i)!=='Paid');

  const paidMtd = invoices.filter(i=>i.paid>0 && i.date.getMonth()===8).reduce((s,i)=>s+i.paid,0);

  return `<div class="g4">

  </div>
  <div class="g12">
    <div class="card"><div class="card-h"><div><h2>A/R aging</h2><div class="sub">Open balances by days past due</div></div></div>${agingChart()}<p style="font-size:.8rem;color:var(--muted);margin-top:.8rem">Blue is not yet due. Yellow is 1 to 60 days late. Red is 61 days or more.</p></div>
    <div class="card"><div class="toolbar"><div class="chips">${['all','Due','Overdue','Partial','Paid'].map(s=>`<button class="chip ${invFilter===s?'on':''}" onclick="invFilter='${s}';render()">${s==='all'?'All':s}</button>`).join('')}</div><span class="spacer"></span><button class="btn btn-ghost btn-sm" onclick="toast('Reminders queued for ${overdue.length} overdue invoices (Resend)')">Send overdue reminders</button><button class="btn btn-cta btn-sm" onclick="openModal('invoice')"><svg><use href="#ic-plus"/></svg>New invoice</button></div>
      <div class="tbl-wrap" style="margin-top:1rem"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Issued</th><th>Due</th><th>Status</th><th class="r">Amount</th><th class="r">Balance</th><th></th></tr></thead><tbody>${list.map(i=>{ const st=invStatus(i), bal=i.amount-i.paid; return `<tr><td class="name">${i.id}<span class="sub" style="font-weight:400">${esc(i.desc)}</span></td><td>${esc(cust(i.cust).name)}</td><td class="num">${fmtD(i.date)}</td><td class="num">${fmtD(i.due)}${st==='Overdue'?`<span class="sub" style="color:var(--crit)">${days(i.due,TODAY)}d late</span>`:''}</td><td>${statusPill(st)}</td><td class="r num">${fmt$c(i.amount)}</td><td class="r num">${bal>0?`<b>${fmt$c(bal)}</b>`:'—'}</td><td style="text-align:right">${bal>0?`<button class="btn btn-blue btn-sm" onclick="openModal('payment','${i.id}')">Record payment</button>`:`<button class="btn btn-ghost btn-sm" onclick="toast('Receipt emailed to ${esc(cust(i.cust).email)}')">Receipt</button>`}</td></tr>`; }).join('')}</tbody></table></div></div>

    <div class="tbl-wrap"><table><thead><tr><th>Vehicle</th><th>Driver</th><th class="r">Odometer</th><th>Next service</th><th>Registration</th><th>Insurance</th><th>Status</th><th></th></tr></thead><tbody>${vehicles.map(v=>{ const pct=Math.min(100,Math.max(0,100-((v.nextService-v.miles)/3000*100))); return `<tr><td class="name">${esc(v.name)}<span class="sub" style="font-weight:400">${v.plate}</span></td><td>${techTag(v.driver)}</td><td class="r num">${v.miles.toLocaleString()} mi</td><td><div class="num">${v.nextServiceType} at ${v.nextService.toLocaleString()} mi</div><div class="meter ${v.miles>=v.nextService?'crit':pct>80?'warn':''}" style="width:140px;margin-top:.3rem"><i style="width:${pct}%"></i></div></td><td class="num">${fmtD(v.reg)}${days(TODAY,v.reg)<60?' <span class="pill p-warn">renew</span>':''}</td><td class="num">${fmtD(v.ins)}</td><td>${statusPill(v.status)}</td><td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="toast('Service logged for ${v.plate} (mock)')">Log service</button></td></tr>`; }).join('')}</tbody></table></div></div>
  <div class="card"><div class="card-h"><div><h2>Tools & test equipment</h2><div class="sub">Calibration and service schedule</div></div><button class="btn btn-ghost btn-sm" onclick="toast('Tool added (mock)')">Add tool</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Tag</th><th>Tool</th><th>Assigned to</th><th>Last service</th><th>Next due</th><th>Status</th><th></th></tr></thead><tbody>${tools.map(t=>`<tr><td class="name">${t.tag}</td><td>${esc(t.name)}</td><td>${t.assigned}</td><td class="num">${fmtDY(t.lastService)}</td><td class="num">${fmtDY(t.nextService)}</td><td>${statusPill(t.status)}</td><td style="text-align:right">${t.status!=='OK'?`<button class="btn btn-blue btn-sm" onclick="toast('${esc(t.name)} sent for calibration (mock)')">Schedule</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
};

views.inventory = () => {
  const low = inventory.filter(p=>p.onHand<p.reorder);
  const value = inventory.reduce((s,p)=>s+p.onHand*p.cost,0);
  setTitle('Inventory', `${inventory.length} SKUs · ${fmt$(value)} on hand · ${low.length} below reorder point`);
  return `<div class="card"><div class="toolbar"><div class="chips"><span class="chip on">All</span></div><span class="spacer"></span><button class="btn btn-ghost btn-sm" onclick="toast('Purchase order drafted for ${low.length} items (mock)')">Draft purchase order</button><button class="btn btn-cta btn-sm" onclick="toast('Item added (mock)')"><svg><use href="#ic-plus"/></svg>Add item</button></div>
    <div class="tbl-wrap" style="margin-top:1rem"><table><thead><tr><th>SKU</th><th>Item</th><th>Location</th><th class="r">On hand</th><th class="r">Reorder at</th><th>Stock</th><th class="r">Unit cost</th><th class="r">Value</th></tr></thead><tbody>${inventory.map(p=>{ const pct=Math.min(100,p.onHand/(p.reorder*2)*100); const lvl=p.onHand===0?'crit':p.onHand<p.reorder?'warn':''; return `<tr><td class="name">${p.sku}</td><td class="wrap">${esc(p.name)}</td><td>${p.loc}</td><td class="r num">${p.onHand}</td><td class="r num">${p.reorder}</td><td><div class="meter ${lvl}" style="width:110px"><i style="width:${pct}%"></i></div>${p.onHand<p.reorder?`<span class="pill ${lvl==='crit'?'p-crit':'p-warn'}" style="margin-top:.3rem">${p.onHand===0?'Out of stock':'Low'}</span>`:''}</td><td class="r num">${fmt$(p.cost)}</td><td class="r num">${fmt$(p.onHand*p.cost)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
};

    <div style="display:grid;gap:1.25rem;align-content:start">

        <div class="integ"><div class="logo" style="background:#3ECF8E">S</div><div><b>Supabase</b><span>Postgres database, auth, and row-level security for every table on this dashboard</span></div>${statusPill('Draft').replace('Draft','Not connected')}</div>
        <div class="integ"><div class="logo" style="background:#000">R</div><div><b>Resend</b><span>Transactional email: estimates, invoices, payment receipts, overdue reminders</span></div>${statusPill('Draft').replace('Draft','Not connected')}</div>
        <div class="integ"><div class="logo" style="background:#000">▲</div><div><b>Vercel</b><span>Hosting for the admin app and the public site, with preview deploys per branch</span></div>${statusPill('Draft').replace('Draft','Not connected')}</div>
        <div class="integ"><div class="logo" style="background:#635BFF">St</div><div><b>Stripe</b><span>Card payments on invoices and a pay link in every reminder email</span></div>${statusPill('Draft').replace('Draft','Planned')}</div>
      </div></div>
      <div class="card"><h2>Users & roles</h2><div class="tbl-wrap" style="margin-top:.7rem"><table><thead><tr><th>User</th><th>Role</th><th>Access</th></tr></thead><tbody>${staff.map(s=>`<tr><td class="name">${s.name}</td><td>${s.id==='MP'?'Admin':s.id==='KW'?'Office':'Technician'}</td><td class="wrap" style="color:var(--muted)">${s.id==='MP'?'Everything':s.id==='KW'?'Schedule, customers, estimates, invoices, inventory':'Own schedule and job details only'}</td></tr>`).join('')}</tbody></table></div></div>

/* ============ MODALS ============ */
function openModal(kind, custId, estId){
  const box = document.getElementById('modal-box');
  const custOpts = customers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${c.id===custId?'selected':''}>${esc(c.name)} · ${esc(c.city)}</option>`).join('');
  const techOpts = techs.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  const est = estId ? estimates.find(e=>e.id===estId) : null;
  if(kind==='job') box.innerHTML = `<h2>New job</h2><form class="f" onsubmit="return saveJob(event)">
    <label>Customer<select name="cust" required>${custOpts}</select></label>
    <label>Service<input name="service" required value="${est?esc(est.desc):''}" placeholder="What are we doing?"></label>
    <div class="row"><label>Type<select name="type">${['Water heater','Tankless','Leak repair','Fixtures','Gas','Drains','Inspection','Upgrades'].map(t=>`<option>${t}</option>`).join('')}</select></label><label>Technician<select name="tech">${techOpts}</select></label></div>
    <div class="row"><label>Date<input name="date" type="date" value="2026-09-21" required></label><label>Quoted amount<input name="amount" type="number" min="0" step="1" value="${est?est.amount:''}" placeholder="0 if quoting on site"></label></div>
    <div class="row"><label>Start<input name="start" value="8:00"></label><label>End<input name="end" value="10:00"></label></div>
    <div class="actions"><button class="btn btn-ghost" type="button" onclick="closeAll()">Cancel</button><button class="btn btn-cta" type="submit">Save job</button></div></form>`;
  if(kind==='payment'){ const i=invoices.find(x=>x.id===custId); box.innerHTML = `<h2>Record payment · ${i.id}</h2><p style="color:var(--muted);margin-bottom:1rem">${esc(cust(i.cust).name)} · Balance ${fmt$c(i.amount-i.paid)}</p><form class="f" onsubmit="return savePayment(event,'${i.id}')">
    <div class="row"><label>Amount<input name="amount" type="number" step="0.01" min="0.01" max="${i.amount-i.paid}" value="${i.amount-i.paid}" required></label><label>Method<select name="method"><option>Card</option><option>Check</option><option>Cash</option><option>ACH</option></select></label></div>
    <div class="row"><label>Date<input type="date" value="2026-09-18"></label><label>Reference<input placeholder="Check # or last 4"></label></div>
    <div class="actions"><button class="btn btn-ghost" type="button" onclick="closeAll()">Cancel</button><button class="btn btn-cta" type="submit">Record payment</button></div></form>`; }
  if(kind==='customer') box.innerHTML = `<h2>New customer</h2><form class="f" onsubmit="return saveCustomer(event)"><label>Name<input name="name" required></label><div class="row"><label>Phone<input name="phone" type="tel" required></label><label>Email<input name="email" type="email"></label></div><label>Street address<input name="addr" required></label><div class="row"><label>City<input name="city" value="Tulsa"></label><label>ZIP<input name="zip"></label></div><label>Notes<textarea name="notes"></textarea></label><div class="actions"><button class="btn btn-ghost" type="button" onclick="closeAll()">Cancel</button><button class="btn btn-cta" type="submit">Save customer</button></div></form>`;
  if(kind==='estimate') box.innerHTML = `<h2>New estimate</h2><form class="f" onsubmit="return saveEstimate(event)"><label>Customer<select name="cust">${custOpts}</select></label><label>Description<textarea name="desc" required></textarea></label><div class="row"><label>Amount<input name="amount" type="number" min="0" required></label><label>Prepared by<select name="tech">${techOpts}</select></label></div><div class="actions"><button class="btn btn-ghost" type="button" onclick="closeAll()">Cancel</button><button class="btn btn-ghost" type="submit" data-status="Draft">Save draft</button><button class="btn btn-cta" type="submit" data-status="Sent">Save &amp; send</button></div></form>`;
  if(kind==='invoice') box.innerHTML = `<h2>New invoice</h2><form class="f" onsubmit="return saveInvoice(event)"><label>Customer<select name="cust">${custOpts}</select></label><label>Description<input name="desc" required></label><div class="row"><label>Amount<input name="amount" type="number" min="0" step="0.01" required></label><label>Terms<select name="terms"><option value="0">Due on completion</option><option value="15">Net 15</option><option value="30">Net 30</option></select></label></div><div class="actions"><button class="btn btn-ghost" type="button" onclick="closeAll()">Cancel</button><button class="btn btn-cta" type="submit">Create &amp; send</button></div></form>`;
  document.getElementById('overlay').classList.add('show'); document.getElementById('modal').classList.add('show');
  const first = box.querySelector('input,select'); if(first) first.focus();
}
let seq = 1062, estSeq = 2240, invSeq = 3130, custSeq = 13;
function saveJob(e){ e.preventDefault(); const f=new FormData(e.target); const [y,m,dd]=f.get('date').split('-').map(Number); jobs.push({id:'J-'+(seq++), date:new Date(y,m-1,dd), start:f.get('start'), end:f.get('end'), cust:f.get('cust'), service:f.get('service'), type:f.get('type'), tech:f.get('tech'), status:'Scheduled', amount:+f.get('amount')||0}); closeAll(); toast('Job scheduled'); go('schedule'); render(); return false; }
function savePayment(e, id){ e.preventDefault(); const f=new FormData(e.target); const i=invoices.find(x=>x.id===id); i.paid = Math.min(i.amount, i.paid + parseFloat(f.get('amount'))); const c=cust(i.cust); c.balance = invoices.filter(x=>x.cust===c.id).reduce((s,x)=>s+(x.amount-x.paid),0); closeAll(); toast(`Payment of ${fmt$c(parseFloat(f.get('amount')))} recorded on ${id}`); render(); return false; }
function saveCustomer(e){ e.preventDefault(); const f=new FormData(e.target); const id='C'+String(custSeq++).padStart(3,'0'); customers.push({id, name:f.get('name'), phone:f.get('phone'), email:f.get('email')||'', addr:f.get('addr'), city:f.get('city'), zip:f.get('zip'), since:TODAY, ltv:0, balance:0, notes:f.get('notes')||'', equipment:[]}); closeAll(); toast('Customer added'); render(); return false; }
function saveEstimate(e){ e.preventDefault(); const f=new FormData(e.target); const status = e.submitter?.dataset.status || 'Draft'; estimates.push({id:'E-'+(estSeq++), date:TODAY, cust:f.get('cust'), desc:f.get('desc'), amount:+f.get('amount'), status, tech:f.get('tech')}); closeAll(); toast(status==='Sent'?'Estimate sent to customer':'Estimate saved as draft'); render(); return false; }
function saveInvoice(e){ e.preventDefault(); const f=new FormData(e.target); const due=new Date(TODAY); due.setDate(due.getDate()+ +f.get('terms')); invoices.push({id:'INV-'+(invSeq++), date:TODAY, due, cust:f.get('cust'), desc:f.get('desc'), amount:+f.get('amount'), paid:0}); closeAll(); toast('Invoice created and emailed'); render(); return false; }

function globalSearch(q){
  q = q.trim().toLowerCase(); if(!q) return;
  const c = customers.find(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q)||c.addr.toLowerCase().includes(q));
  const j = jobs.find(j=>j.id.toLowerCase()===q); const i = invoices.find(i=>i.id.toLowerCase()===q);
  if(j) { showJob(j.id); return; }
  if(i) { invFilter='all'; go('invoices'); return; }
  if(c && q.length>=3) showCustomer(c.id);
}

/* ============ ROUTER ============ */
function render(){
  const id = location.hash.replace('#','') || 'dashboard';
  const v = views[id] || views.dashboard;
  document.getElementById('content').innerHTML = v();
  renderNav();
  document.getElementById('sidebar').classList.remove('open');
  if(id==='dashboard') columnChart(document.getElementById('ch-week'), weeklyRev, {label:'wk'});
  if(id==='reports') columnChart(document.getElementById('ch-month'), monthlyRev, {label:'m', h:240});
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAll(); });
try{ if(sessionStorage.getItem('porter-admin-demo')) document.getElementById('login').hidden = true; }catch(e){}
render();
</script>
